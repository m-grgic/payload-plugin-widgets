name: Release

# A tag v1.2.3 on a commit whose package.json says 1.2.3 is checked, built and published to npm.
# Nothing is kept secret here: npm trusts this workflow of this repository (a "trusted publisher", set up once
# under the package's settings on npmjs.com), so there is no token to store or to leak.
# Once it is on npm, the tag gets a GitHub release whose notes are what CHANGELOG.md says under that version.

on:
  push:
    tags: ['v*']

permissions:
  # write: the GitHub release is made with this workflow's own token
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: widgets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: postgres://postgres:postgres@127.0.0.1:5432/widgets_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # trusted publishing needs npm 11.5.1 or later, which Node 24 brings
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: The tag is the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but package.json says $version"
            exit 1
          fi
      # a version the changelog says nothing about is not published; what it says is kept for the release
      - name: The changelog has the version
        run: |
          version=${GITHUB_REF_NAME#v}
          # from the line after "## 1.2.3" to the next "## "
          awk -v version="$version" '
            /^## / { if (found) exit; sub(/^## +\[?v?/, ""); split($0, words, /[] ]/); found = words[1] == version; next }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q "[^[:space:]]" "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # packed by pnpm, which points the exports at dist; published by npm, which sends the README along
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - run: npm publish "$RUNNER_TEMP"/payload-plugin-widgets-*.tgz --access public --ignore-scripts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
